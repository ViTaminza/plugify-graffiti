// Graffiti — граффити для всех игроков, без предметов в инвентаре.
// Рисунки, цвета и названия берутся из файлов игры, новые граффити CS2 появятся в меню сами.
"Graffiti"
{
	"enabled"           "1"
	"commands"          "!graffiti,!spray"    // чат-команды меню
	"spray_commands"    ""                    // чат-команды «нарисовать»; консольная mm_spray есть всегда (bind t mm_spray)
	"double_e"          "1"                   // рисовать двойным нажатием E — по умолчанию у новых игроков (каждый меняет у себя)
	"double_e_window"   "0.35"                // сколько секунд между двумя нажатиями E
	"cooldown"          "30"                  // секунд между граффити одного игрока
	"max_distance"      "150"                 // как близко нужно стоять к стене (юнитов)
	"one_per_player"    "1"                   // новое граффити убирает прежнее этого же игрока
	"lifetime"          "0"                   // через сколько секунд убирать граффити, 0 — не убирать (до конца раунда/карты)
	"sound"             "SprayCan.Paint"      // звук, пусто — без звука
	"utils_settings"    "1"                   // переключатель «Граффити двойным E» в общем меню настроек utils
	"default_kit"       "0"                   // рисунок новых игроков: id из sticker_kits (spray_*), 0 — случайный
	"default_tint"      "0"                   // цвет новых игроков: 1..19, 0 — случайный
}
